; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = aeropad

[env:aeropad]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_port = COM11
upload_speed = 460800
monitor_port = COM11
monitor_speed = 115200
extra_scripts = pre:tools/build_hooks.py
build_flags = 
	-DARDUINO_LOOP_STACK_SIZE=32768
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DUSER_SETUP_LOADED=1
	-include include/tft_sprite_setup.h
lib_deps = 
	bodmer/TFT_eSPI@2.5.43
	nrf24/RF24@1.4.8
	thomasfredericks/Bounce2@2.72
	tockn/MPU6050_tockn@1.5.2
	adafruit/Adafruit MCP23017 Arduino Library@2.3.2
	adafruit/Adafruit BusIO@1.17.4
	lemmingDev/ESP32-BLE-Gamepad@0.7.3
	h2zero/NimBLE-Arduino@2.5.1
