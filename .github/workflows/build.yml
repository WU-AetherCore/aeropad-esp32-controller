name: Firmware and protocol checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.18
      - name: Protocol, navigation and geometry checks
        run: |
          for test in control_packet navigation cube local_games puzzle_games; do
            g++ -std=c++17 tools/test_${test}.cpp -o /tmp/test_${test}
            /tmp/test_${test}
          done
      - name: Controller firmware
        run: pio run -e aeropad
      - name: Separate receiver example
        run: pio run -d examples/AeroPad-BLE-Receiver
